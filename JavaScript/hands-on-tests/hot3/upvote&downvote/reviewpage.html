<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="script.js" defer></script>
</head>
<body>
  <h1 class="text-center fw-bold">How well do you like this product?</h1>
  <img src="twix.png" alt="twix bar" width="300" class="rounded mx-auto d-block">
  <div id="thefightingring">
    <div id="totalScore" class="text-center fw-bold"></div><br>
    <div class="border border-3 rounded-5 container text-center row row-cols-2 p-3 mx-auto col-4">
      <div class="col-6">
        <button id="upvote" class="rounded-3">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#0bbd1d"><path d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z"/></svg>
        </button>
        <div id="upvoteNum"></div>
      </div>
      <div class="col-6">
        <button id="downvote" class="rounded-3">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e60000"><path d="M240-840h440v520L400-40l-50-50q-7-7-11.5-19t-4.5-23v-14l44-174H120q-32 0-56-24t-24-56v-80q0-7 2-15t4-15l120-282q9-20 30-34t44-14Zm360 80H240L120-480v80h360l-54 220 174-174v-406Zm0 406v-406 406Zm80 34v-80h120v-360H680v-80h200v520H680Z"/></svg>
        </button>
        <div id="downvoteNum"></div>
      </div>

    </div>

  </div>
</body>
</html>
