<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="script.js" defer></script>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="form-signin position-absolute top-50 start-50 translate-middle">
    <h1 class="h3 mb-3 fw-normal">Sign In</h1>
    <form>
      <label for="email">Email:</label>
      <input id="email" name="email" type="email" autocomplete="email" class="form-control">
      <label for="password">Password:</label>
      <input id="password" name="password" type="password" autocomplete="password" class="form-control">
      <button id="submit" type="submit" class="btn btn-primary w-100 py-2 mt-2">Submit</button>
      <div id="errMsgBox" class="text-danger"></div>
      <div id="successMsgBox" class="text-success"></div>
    </form>
  </main>
  
</body>
</html>
